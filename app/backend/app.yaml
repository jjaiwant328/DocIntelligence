command:
- uvicorn
- app:app
- --host
- 0.0.0.0
- --port
- '8000'
env:
- name: DATABRICKS_APP_PORT
  value: '8000'
- name: DATABRICKS_WAREHOUSE_ID
  value: 85a4ed5bcff25c0d
- name: STATIC_FILES_PATH
  value: /Workspace/Users/jaiwant.jonathan@databricks.com/docintel-app/static
- name: DATABRICKS_VOLUME_PATH
  value: /Volumes/jai_docintel/raw/documents/
- name: DATABRICKS_DELTA_TABLE_PATH
  value: jai_docintel.raw.parsed_documents_interactive
- name: BATCH_INPUT_VOLUME_PATH
  value: /Volumes/jai_docintel/raw/documents/
- name: BATCH_JOB_NAME
  value: "[dev jaiwant_jonathan] ai_parse_document_app_workflow"
- name: DOCINTEL_CATALOG
  value: jai_docintel
- name: DOCINTEL_SCHEMA_RAW
  value: raw
- name: DOCINTEL_SCHEMA_ONT
  value: ontology
- name: DOCINTEL_SCHEMA_VEC
  value: vectors
- name: DOCINTEL_SCHEMA_AGT
  value: agents
- name: DOCINTEL_AGENT_MODEL
  value: databricks-claude-sonnet-4-5
- name: DOCINTEL_AGENT_DETERMINISTIC
  value: "true"
# Bundle notebook base path — the provisioner points new use cases' pipeline
# jobs at these notebooks (folds out create_domain_job.py's hardcoded NB_BASE).
- name: DOCINTEL_NB_BASE
  value: /Workspace/Users/jaiwant.jonathan@databricks.com/.bundle/docintel/dev/files
# ── Lakebase (managed Postgres) operational store ─────────────────────────────
- name: LAKEBASE_ENABLED
  value: "true"
- name: LAKEBASE_ENDPOINT
  value: projects/docintel/branches/production/endpoints/primary
- name: LAKEBASE_HOST
  value: ep-shy-block-e3xwzxuz.database.westus.azuredatabricks.net
- name: LAKEBASE_DB
  value: docintel
- name: LAKEBASE_SCHEMA
  value: app
# Postgres login = the app service principal's client id (see db/lakebase.py)
- name: LAKEBASE_USER
  value: 00ec2ab7-2445-4bc8-b68d-25e463b5bbe3
# ── Document-source MCP server (separate Databricks App) ──────────────────────
# Base URL of the deployed mcp-gdrive-sources app; the backend calls its /mcp
# Streamable HTTP endpoint. Leave empty to disable the "Import from a source" UI.
- name: DOCINTEL_MCP_SOURCES_URL
  value: ""
runtime: python_3.10
