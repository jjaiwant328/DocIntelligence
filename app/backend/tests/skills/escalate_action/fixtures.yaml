cases:
  - name: happy
    inputs: {"action_id": "A-1"}
    fake: {internal_name: escalate_action, internal_out: {"action_id": "A-1", "status": "ESCALATED"}}
    expect: {status: ESCALATED, output_has: ["action_id"]}
  - name: missing_input
    inputs: {}
    fake: {internal_name: escalate_action, internal_out: {}}
    expect: {status: error, error_contains: action_id}
  - name: invalid
    inputs: {"action_id": 123}
    fake: {internal_name: escalate_action, internal_out: {}}
    expect: {status: error}
  - name: insufficient_evidence
    inputs: {"action_id": "A-1"}
    fake: {internal_name: escalate_action, internal_out: {"action_id": "A-1", "status": "ESCALATED"}}
    expect: {status: ESCALATED}
  - name: ambiguous
    inputs: {"action_id": "A-1"}
    fake: {internal_name: escalate_action, internal_out: {"action_id": "A-1", "status": "ESCALATED"}}
    expect: {status: ESCALATED}
