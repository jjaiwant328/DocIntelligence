# Compliance/Audit template — what requirements apply, are we compliant, evidence, remediation.
id: compliance_audit
version: "1.0"
approval_before: create_action
steps:
  - id: create_audit
    skill: create_work_object
    inputs_map: {domain: $input.domain, project: $input.project, type: review}
  - id: identify_requirements
    skill: extract_requirements
    inputs_map: {domain: $input.domain, project: $input.project, candidate_requirements: $domain.requirements, context: $input.context}
  - id: collect_evidence
    skill: find_supporting_evidence
    inputs_map: {query: $input.project, schema_vec: $input.schema_vec, k: 6}
  - id: evaluate
    skill: assess_requirement
    inputs_map: {requirements: $steps.identify_requirements.requirements, evidence: $steps.collect_evidence.evidence}
  - id: verify
    skill: verify_evidence
    inputs_map: {conclusion: $input.project, evidence: $steps.collect_evidence.evidence}
  - id: gaps
    skill: identify_gap
    inputs_map: {assessments: $steps.evaluate.assessments}
  - id: risk
    skill: assess_risk
    inputs_map: {gaps: $steps.gaps.gaps, evidence: $steps.collect_evidence.evidence}
  - id: summary
    skill: generate_executive_summary
    inputs_map: {findings: $steps.gaps.gaps, risk: $steps.risk.risk}
  - id: actions
    skill: create_action
    inputs_map: {domain: $input.domain, project: $input.project, proposed_actions: $steps.gaps.gaps}
