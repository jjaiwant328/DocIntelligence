id: supplier_scorecard
version: "1.0"
name: "Supplier Scorecard (prebuilt)"
description: >
  Prebuilt Supplier Performance workflow. Reconciles supplier invoices against
  their master contracts and delivery schedules to score on-time delivery,
  pricing, and SLA performance, then raises disputes for the discrepancies.
approval_before: create_action
steps:
  - id: open_review
    skill: create_work_object
    inputs_map: {domain: $input.domain, project: $input.project, type: review}
  - id: reconcile
    skill: reconcile_documents
    inputs_map:
      documents: $docs.items
      checks:
        - "on_time_delivery: compare each delivery schedule's actual_date vs promised_date; flag late lines and compute on-time %"
        - "price_variance: compare each invoice unit_price vs the contract unit_price; flag overbilling and sum the $ impact"
        - "sla_breach: compare computed on-time % vs the contract on_time_sla_pct; flag if below"
      reference_types: [master_contract, delivery_schedule]
      subject_types: [invoice]
  - id: summary
    skill: generate_executive_summary
    inputs_map: {findings: $steps.reconcile.findings, risk: $steps.reconcile.scorecard.overall}
  - id: disputes
    skill: create_action
    inputs_map: {domain: $input.domain, project: $input.project, proposed_actions: $steps.reconcile.findings}
