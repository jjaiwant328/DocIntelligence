id: find_prior_decisions
version: "1.0"
category: retrieval
description: Retrieve prior decisions/responses relevant to the query (reuse history).
adapter: uc_function
implementation: _vs_search
inputs:
  query:      {type: string, required: true}
  schema_vec: {type: string, required: true}
  k:          {type: integer, required: false}
