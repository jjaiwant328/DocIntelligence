id: determine_impact
version: "1.0"
category: reasoning
description: Given detected changes, determine what/who is impacted and how.
adapter: llm_schema
implementation: prompts/determine_impact.md
inputs:
  changes:           {type: array, required: true}
  affected_entities: {type: array, required: false}
outputs:
  impact:   {type: string}
  impacted: {type: array}
  evidence: {type: array}
required_capabilities: [llm]
ontology_dependencies: []
evidence_requirements: optional
side_effects: {creates_actions: false}
test_method: tests/skills/determine_impact/
