id: create_finding
version: "1.0"
category: workflow
description: Record a finding (gap/risk/observation) against a work object.
adapter: internal_call
implementation: create_finding
inputs:
  work_object_id: {type: string, required: true}
  finding_type:   {type: string, required: true}
  description:    {type: string, required: true}
outputs:
  finding_id: {type: string}
required_capabilities: [sql]
ontology_dependencies: []
evidence_requirements: optional
side_effects: {creates_actions: false, writes: true}
test_method: tests/skills/create_finding/
