id: extract_entities
version: "1.0"
category: understanding
description: Extract named entities from document text, typed per the ontology.
adapter: llm_schema
implementation: prompts/extract_entities.md
inputs:
  text:          {type: string, required: true}
  entity_types:  {type: array,  required: false}
outputs:
  entities: {type: array}
  evidence: {type: array}
required_capabilities: [llm]
ontology_dependencies: [Entity]
evidence_requirements: optional
side_effects: {creates_actions: false}
test_method: tests/skills/extract_entities/
