id: extract_requirements
version: "1.0"
category: understanding
description: Resolve the requirement set that applies to a project from domain config.
adapter: llm_schema
implementation: prompts/extract_requirements.md
inputs:
  domain:               {type: string, required: true}
  project:              {type: string, required: true}
  candidate_requirements: {type: array, required: true}
  context:              {type: string, required: false}
outputs:
  requirements: {type: array}
  evidence:     {type: array}
required_capabilities: [llm]
ontology_dependencies: [Requirement]
evidence_requirements: optional
side_effects: {creates_actions: false}
test_method: tests/skills/extract_requirements/
