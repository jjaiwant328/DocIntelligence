id: classify_document
version: "1.0"
category: understanding
description: Classify a document into one of the domain's document types.
adapter: llm_schema
implementation: prompts/classify_document.md
inputs:
  text:   {type: string, required: true}
  labels: {type: array,  required: false}
outputs:
  doc_type:   {type: string}
  confidence: {type: number}
  evidence:   {type: array}
required_capabilities: [llm]
ontology_dependencies: []
evidence_requirements: optional
side_effects: {creates_actions: false}
test_method: tests/skills/classify_document/
